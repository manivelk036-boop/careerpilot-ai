server.port=${PORT:8080}

# ─── MySQL Database Connection (Environment Variables + Default) ──
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/careerpilot_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── Hibernate / JPA Rules ─────────────────────────────────────
# STRICTLY 'none': never modify, alter, drop, or recreate your existing MySQL tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ─── JWT Security ──────────────────────────────────────────────
jwt.secret=${JWT_SECRET:CareerPilotAI2026VeryLongSecureSecretKeyForJWTSigningHMACSHA512ExtraPaddingToEnsureItIsOver512Bits}
jwt.expiration.ms=${JWT_EXPIRY_MS:86400000}

# ─── Logging ───────────────────────────────────────────────────
logging.level.com.careerpilot=INFO
logging.level.org.springframework.security=WARN
